<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لا يوجد اتصال · No connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f4ef; color: #1b2a28; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: .25rem 0; color: #5b6b68; }
    button { margin-top: 1rem; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #0f6e62; color: #fff; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>لم يتم حفظ أي شيء. أعد المحاولة عند عودة الاتصال.</p>
    <h1 dir="ltr" style="margin-top:1.5rem">You are offline</h1>
    <p dir="ltr">Nothing was saved. Try again when you are back online.</p>
    <button onclick="location.reload()">↻</button>
  </main>
</body>
</html>
